<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>需求清单后台 · Stata 实证计量</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6fb; color: #1f2733; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #5b6675; font-size: 13px; margin-bottom: 18px; }
  .login { background: #fff; border: 1px solid #e6eaf2; border-radius: 16px; padding: 28px; box-shadow: 0 6px 24px rgba(31,39,51,.08); max-width: 380px; margin: 80px auto; }
  .login input { width: 100%; padding: 12px 14px; border: 1px solid #e6eaf2; border-radius: 10px; font-size: 15px; margin: 10px 0 14px; }
  .login button, .bar button, .export { background: #2f6bff; color: #fff; border: none; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .login button:hover { background: #1b4fd6; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
  .bar .spacer { flex: 1; }
  .bar button, .export { padding: 10px 14px; font-size: 14px; }
  .export { background: #13c2a3; }
  .logout { background: #eef1f7; color: #1f2733; }
  .count { color: #5b6675; font-size: 13px; }
  .card { background: #fff; border: 1px solid #e6eaf2; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(31,39,51,.05); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .biz { font-weight: 700; font-size: 16px; color: #1b4fd6; }
  .time { color: #5b6675; font-size: 12px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-left: 8px; }
  .tag.ok { background: #e8f8f3; color: #0f6e56; }
  .tag.no { background: #fff7f2; color: #ff7a45; }
  .sec { font-size: 12px; font-weight: 700; color: #5b6675; margin: 14px 0 6px; border-left: 4px solid #2f6bff; padding-left: 8px; }
  .line { display: flex; gap: 10px; font-size: 14px; padding: 4px 0; }
  .line .k { flex: 0 0 110px; color: #5b6675; font-weight: 600; }
  .line .v { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .files a { display: inline-block; margin: 4px 8px 4px 0; background: #eaf1ff; color: #1b4fd6; border-radius: 8px; padding: 6px 12px; font-size: 13px; text-decoration: none; }
  .files a:hover { background: #dbe7ff; }
  .empty { text-align: center; color: #5b6675; padding: 60px 0; }
  .err { color: #a32d2d; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login">
    <h1>需求清单后台</h1>
    <div class="sub">Stata 实证计量 · 客户引导小程序</div>
    <label style="font-size:14px;font-weight:600">访问口令</label>
    <input id="token" type="password" placeholder="请输入口令" />
    <button id="enter">进入</button>
    <div id="lerr" class="err"></div>
  </div>

  <div id="panel" style="display:none">
    <div class="bar">
      <h1 style="margin:0">需求清单</h1>
      <span id="count" class="count"></span>
      <span class="spacer"></span>
      <button class="export" id="export">导出全部</button>
      <button class="logout" id="logout">退出</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  let TOKEN = sessionStorage.getItem("admin_token") || "";

  function showLogin() { $("#login").style.display = "block"; $("#panel").style.display = "none"; }
  function showPanel() { $("#login").style.display = "none"; $("#panel").style.display = "block"; load(); }

  $("#enter").addEventListener("click", () => {
    const t = $("#token").value.trim();
    if (!t) { $("#lerr").textContent = "请输入口令"; return; }
    TOKEN = t;
    sessionStorage.setItem("admin_token", TOKEN);
    fetch("/api/submissions?token=" + encodeURIComponent(TOKEN))
      .then((r) => { if (!r.ok) throw new Error("auth"); return r.json(); })
      .then(() => showPanel())
      .catch(() => { $("#lerr").textContent = "口令错误或无数据"; sessionStorage.removeItem("admin_token"); });
  });
  $("#logout").addEventListener("click", () => { sessionStorage.removeItem("admin_token"); TOKEN = ""; showLogin(); });

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function renderItem(it) {
    const tag = it.review && it.review.choice === "correct"
      ? '<span class="tag ok">已确认</span>'
      : (it.review && it.review.choice ? '<span class="tag no">需修正</span>' : "");
    const fix = (it.review && it.review.fix) ? `<div class="line"><span class="k">修正说明</span><span class="v">${esc(it.review.fix)}</span></div>` : "";
    const demand = (it.demandSummary || []).map((l) => {
      const i = l.indexOf("：");
      const k = i > -1 ? l.slice(0, i) : "";
      const v = i > -1 ? l.slice(i + 1) : l;
      return `<div class="line"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
    }).join("");
    const files = (it.files && it.files.length)
      ? `<div class="files">${it.files.map((f) => `<a href="/api/file/${encodeURIComponent(it.id)}/${encodeURIComponent(f.name)}?token=${encodeURIComponent(TOKEN)}">${esc(f.name)}</a>`).join("")}</div>`
      : '<div class="line"><span class="k">附件</span><span class="v">无</span></div>';
    return `<div class="card">
      <div class="top"><span class="biz">${esc(it.business)}</span><span class="time">${esc(it.submittedAt)}</span></div>
      <div>${tag}</div>
      <div class="sec">需求明细</div>
      ${demand || '<div class="line"><span class="v">（无）</span></div>'}
      ${fix}
      <div class="sec">需提交文件说明</div>
      <div class="line"><span class="v">${esc(it.step6 || "（无）")}</span></div>
      <div class="sec">客户附件</div>
      ${files}
    </div>`;
  }

  function load() {
    fetch("/api/submissions?token=" + encodeURIComponent(TOKEN))
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then((d) => {
        const items = d.items || [];
        $("#count").textContent = "共 " + items.length + " 条";
        $("#list").innerHTML = items.length ? items.map(renderItem).join("") : '<div class="empty">还没有客户提交需求</div>';
      })
      .catch(() => { $("#list").innerHTML = '<div class="empty">加载失败，请重新登录</div>'; });
  }

  $("#export").addEventListener("click", () => {
    fetch("/api/submissions?token=" + encodeURIComponent(TOKEN))
      .then((r) => r.json())
      .then((d) => {
        const blob = new Blob([JSON.stringify(d.items || [], null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "需求清单_" + new Date().toISOString().slice(0, 10) + ".json";
        a.click();
        URL.revokeObjectURL(a.href);
      });
  });

  if (TOKEN) { $("#token").value = TOKEN; showPanel(); } else { showLogin(); }
</script>
</body>
</html>
